services:
  db:
    image: postgres:16
    container_name: aqualedger360-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aqualedger360}
      POSTGRES_USER: ${POSTGRES_USER:-aqualedger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aqualedger}
    ports:
      - "5432:5432"
    volumes:
      - aqualedger_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aqualedger} -d ${POSTGRES_DB:-aqualedger360}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["full"]
    build: ./backend
    container_name: aqualedger360-api
    env_file:
      - .env
    environment:
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-aqualedger360}
      POSTGRES_USER: ${POSTGRES_USER:-aqualedger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aqualedger}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      SEED_DEMO_ON_START: ${SEED_DEMO_ON_START:-true}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    profiles: ["full"]
    build: ./frontend
    container_name: aqualedger360-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  aqualedger_pg:
  media_data:
